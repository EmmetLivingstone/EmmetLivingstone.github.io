  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-top:8px; font-variant-numeric:tabular-nums;\">\n                      <span>{{ currentTimeStr }}<\u002Fspan><span>{{ durationStr }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasTranscript }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border-top:1px solid oklch(28% 0.012 60); margin-top:20px; padding-top:18px; min-height:56px; display:flex; align-items:center; justify-content:center; text-align:center;\">\n                    <p style=\"margin:0; font-family:'Playfair Display',serif; font-style:italic; font-size:17px; line-height:1.5; color:oklch(94% 0.006 75);\">{{ subtitleText }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <audio ref=\"{{ setAudioRef }}\" src=\"{{ selectedRadio.audio }}\" style=\"display:none\"><\u002Faudio>\n\n              <a href=\"{{ selectedRadio.url }}\" target=\"_blank\" style=\"display:inline-block; font-size:13px; font-weight:600; letter-spacing:0.02em;\">View on {{ selectedRadio.outlet }} →<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isRadioArchive }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ radioGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"margin-bottom:32px;\">\n              <div style=\"display:flex; align-items:center; gap:8px; margin:0 0 10px;\">\n                <div style=\"width:8px; height:8px; background:oklch(33% 0.15 25);\"><\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:oklch(30% 0.015 60);\">{{ g.name }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div style=\"padding:8px 0 8px 16px;\">\n                  <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:24px;\">\n                    <a href=\"{{ it.url }}\" target=\"_blank\" style=\"font-size:15px; color:oklch(18% 0.012 60);\">{{ it.title }}<\u002Fa>\n                    <span style=\"font-size:13px; color:oklch(52% 0.015 60); white-space:nowrap; flex-shrink:0;\">{{ it.date }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ it.quote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin:10px 0 4px;\">\n                      <p style=\"margin:0; font-family:'Playfair Display',serif; font-style:italic; font-size:17px; line-height:1.5; color:oklch(30% 0.02 60);\"><span style=\"font-size:28px; font-weight:700; color:oklch(33% 0.15 25); vertical-align:-3px; margin-right:3px;\">“<\u002Fspan>{{ it.quote }}<span style=\"font-size:28px; font-weight:700; color:oklch(33% 0.15 25); vertical-align:-6px;\">”<\u002Fspan><\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;baobabQuote&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Demographic pressure in Kinshasa is intense \\u2013 the population grows by about 730,000 people a year.&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Archive pull quotes&quot;}, &quot;scienceQuote&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;There\\u2019s almost no climate data being collected on the ground, particularly from the Democratic Republic of Congo.&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Archive pull quotes&quot;}}\">\nclass Component extends DCLogic {\n  state = { section: 'home', reportingView: 'featured', radioView: 'featured', openFeaturedId: null, openRadioId: null, playing: false, currentTime: 0, duration: 0, waveformPeaks: null, activeSegIndex: -1 };\n\n  go(section) { this.setState({ section }); }\n  setView(kind, view) { this.setState({ section: kind, [kind + 'View']: view }); }\n  toggleOpen(kind, id) {\n    const key = kind === 'reporting' ? 'openFeaturedId' : 'openRadioId';\n    this.setState(st => ({ [key]: st[key] === id ? null : id }));\n  }\n  toggleRadio(item) {\n    const wasSame = this.state.openRadioId === item.id;\n    if (this.audioEl) this.audioEl.pause();\n    this.stopVisualizer();\n    this.pendingStartAt = wasSame ? 0 : (item.startAt || 0);\n    this.startApplied = false;\n    this.currentSegments = (!wasSame && item.transcript) ? this.parseTranscript(item.transcript) : null;\n    this.setState({ openRadioId: wasSame ? null : item.id, playing: false, currentTime: this.pendingStartAt, duration: 0, waveformPeaks: null, activeSegIndex: -1, liveLevels: null });\n    if (!wasSame && item.audio) this.loadWaveform(item.audio);\n  }\n  setupAnalyser() {\n    if (this.analyser) return;\n    try {\n      const Ctx = window.AudioContext || window.webkitAudioContext;\n      this.audioCtx = new Ctx();\n      const source = this.audioCtx.createMediaElementSource(this.audioEl);\n      this.analyser = this.audioCtx.createAnalyser();\n      this.analyser.fftSize = 1024;\n      this.analyser.smoothingTimeConstant = 0.35;\n      source.connect(this.analyser);\n      this.analyser.connect(this.audioCtx.destination);\n    } catch (e) {}\n  }\n  tickVisualizer() {\n    if (!this.analyser || !this.state.playing) return;\n    const now = performance.now();\n    if (!this.lastTick || now - this.lastTick > 55) {\n      this.lastTick = now;\n      const data = new Uint8Array(this.analyser.fftSize);\n      this.analyser.getByteTimeDomainData(data);\n      const bars = 70;\n      const step = Math.max(1, Math.floor(data.length / bars));\n      const levels = [];\n      for (let i = 0; i < bars; i++) {\n        let peak = 0;\n        for (let j = i * step; j < Math.min(data.length, (i + 1) * step); j++) { const v = Math.abs(data[j] - 128) / 128; if (v > peak) peak = v; }\n        levels.push(Math.min(1, Math.pow(peak * 2.2, 0.6)));\n      }\n      this.setState({ liveLevels: levels });\n    }\n    this.rafId = requestAnimationFrame(() => this.tickVisualizer());\n  }\n  stopVisualizer() {\n    if (this.rafId) cancelAnimationFrame(this.rafId);\n    this.rafId = null;\n  }\n  parseTranscript(raw) {\n    const re = /\\((\\d+):(\\d{2})\\)/g;\n    const matches = [...raw.matchAll(re)];\n    if (!matches.length) return [{ start: 0, text: raw.trim() + ' ' }];\n    const segments = [];\n    const leading = raw.slice(0, matches[0].index).trim();\n    if (leading) segments.push({ start: 0, text: leading + ' ' });\n    for (let i = 0; i < matches.length; i++) {\n      const m = matches[i];\n      const time = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);\n      const textStart = m.index + m[0].length;\n      const textEnd = i + 1 < matches.length ? matches[i + 1].index : raw.length;\n      const text = raw.slice(textStart, textEnd).trim();\n      if (text) segments.push({ start: time, text: text + ' ' });\n    }\n    return segments;\n  }\n  async loadWaveform(url) {\n    try {\n      const resp = await fetch(url);\n      const buf = await resp.arrayBuffer();\n      const Ctx = window.AudioContext || window.webkitAudioContext;\n      const ctx = new Ctx();\n      const audioBuf = await ctx.decodeAudioData(buf);\n      const data = audioBuf.getChannelData(0);\n      const bars = 90;\n      const blockSize = Math.floor(data.length / bars) || 1;\n      const peaks = [];\n      for (let i = 0; i < bars; i++) {\n        let max = 0;\n        const start = i * blockSize;\n        for (let j = 0; j < blockSize; j++) { const v = Math.abs(data[start + j] || 0); if (v > max) max = v; }\n        peaks.push(max);\n      }\n      const maxPeak = Math.max(...peaks, 0.0001);\n      this.setState({ waveformPeaks: peaks.map(p => p / maxPeak) });\n      ctx.close();\n    } catch (e) { this.setState({ waveformPeaks: null }); }\n  }\n  setAudioRef(el) {\n    this.audioEl = el;\n    if (el) {\n      el.ontimeupdate = () => {\n        const ct = el.currentTime;\n        this.setState(st => {\n          let activeSegIndex = st.activeSegIndex;\n          if (this.currentSegments && this.currentSegments.length) {\n            let idx = -1;\n            for (let i = 0; i < this.currentSegments.length; i++) { if (this.currentSegments[i].start <= ct) idx = i; else break; }\n            activeSegIndex = idx;\n          }\n          return { currentTime: ct, activeSegIndex };\n        });\n      };\n      el.onloadedmetadata = () => {\n        const start = this.pendingStartAt || 0;\n        if (!isFinite(el.duration)) {\n          el.currentTime = 1e101;\n          const fixDuration = () => {\n            el.removeEventListener('timeupdate', fixDuration);\n            if (!this.startApplied && start) { el.currentTime = start; this.startApplied = true; }\n            this.setState({ duration: el.duration || 0, currentTime: el.currentTime });\n          };\n          el.addEventListener('timeupdate', fixDuration);\n        } else {\n          if (!this.startApplied && start) { el.currentTime = start; this.startApplied = true; }\n          this.setState({ duration: el.duration || 0, currentTime: el.currentTime });\n        }\n      };\n      el.onended = () => { this.stopVisualizer(); this.setState({ playing: false }); };\n    }\n  }\n  setTranscriptRef(el) { this.transcriptEl = el; }\n  setSegRef(i, el) { if (!this.segEls) this.segEls = {}; this.segEls[i] = el; }\n  togglePlay() {\n    if (!this.audioEl) return;\n    if (this.state.playing) {\n      this.audioEl.pause(); this.stopVisualizer(); this.setState({ playing: false });\n    } else {\n      this.setupAnalyser();\n      if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();\n      if (!this.startApplied && this.pendingStartAt) {\n        this.audioEl.currentTime = this.pendingStartAt;\n        this.startApplied = true;\n      }\n      const p = this.audioEl.play();\n      if (p && p.catch) p.catch(() => this.setState({ playing: false }));\n      this.setState({ playing: true });\n      this.rafId = requestAnimationFrame(() => this.tickVisualizer());\n    }\n  }\n  seekAudio(e) {\n    if (!this.audioEl || !this.state.duration) return;\n    const rect = e.currentTarget.getBoundingClientRect();\n    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));\n    this.audioEl.currentTime = ratio * this.state.duration;\n    this.setState({ currentTime: this.audioEl.currentTime });\n  }\n  fmtTime(s) {\n    if (!s || isNaN(s) || !isFinite(s)) return '0:00';\n    const m = Math.floor(s / 60), sec = Math.floor(s % 60).toString().padStart(2, '0');\n    return `${m}:${sec}`;\n  }\n\n  renderVals() {\n    const s = this.state.section;\n    const navConf = [\n      { key: 'home', label: 'About' },\n      { key: 'reporting', label: 'Selected reporting', children: [\n        { label: 'Featured', view: 'featured' },\n        { label: 'Archive', view: 'archive' },\n      ]},\n      { key: 'radio', label: 'Radio', children: [\n        { label: 'Featured', view: 'featured' },\n        { label: 'Archive', view: 'archive' },\n      ]},\n    ];\n    const navItems = navConf.map(n => ({\n      label: n.label,\n      onClick: () => this.go(n.key),\n      color: s === n.key ? 'oklch(15% 0.012 60)' : 'oklch(45% 0.015 60)',\n      border: s === n.key ? 'oklch(33% 0.15 25)' : 'transparent',\n      expanded: s === n.key && !!n.children,\n      children: (n.children || []).map(c => ({\n        label: c.label,\n        onClick: () => this.setView(n.key, c.view),\n      })),\n    }));\n\n    const activeChip = (active) => ({\n      bg: active ? 'oklch(33% 0.15 25)' : 'transparent',\n      text: active ? 'oklch(99% 0.004 80)' : 'oklch(35% 0.015 60)',\n    });\n    const rChip = activeChip(this.state.reportingView === 'featured');\n    const rAChip = activeChip(this.state.reportingView === 'archive');\n    const dChip = activeChip(this.state.radioView === 'featured');\n    const dAChip = activeChip(this.state.radioView === 'archive');\n\n    const featured = [\n      { id: 'f1', outlet: 'The Guardian', title: \"'She gave her life to protect the richness of Congo': inside the deadly assault on Upemba wildlife park\", dek: \"At 5.40am machine-gun fire began to rattle out of the surrounding darkness.\\n\", date: 'March 22, 2026', url: 'https://www.theguardian.com/environment/2026/mar/22/upemba-national-park-drc-militia-assault-rangers-killed-aoe',\n        summary: [\"Nearby Congolese soldiers had received warnings of the attack in the morning. But the soldiers did not arrive until late in the evening, long after the killings were over.\", \"It happened before dawn on Tuesday 3 March, as a dozen rangers at Upemba national park headquarters were being briefed by their commander before the day’s routine anti-poaching patrol. At 5.40am machine-gun fire began to rattle out of the surrounding darkness.\", \"As many as 80 heavily armed fighters had crept in through the protected grasslands in south-east Democratic Republic of the Congo and encircled Lusinga, the park headquarters perched on a steep grassy ridge.\", \"The few rangers scrambled to defend the base. But within half an hour, the attackers had overwhelmed them. They looted weapons and munitions, chanted war songs, and searched door-to-door for the targets on their kill list.\", \"Seven people were killed during the mayhem, including five civilians, among them young Congolese conservationists and motorbike drivers.\", \"“We tried to fight back, but they dominated us,” says Innocent Mburanumwe, Upemba’s deputy director, who was in the briefing room when the attack began. “It was horrible.”\", \"Upemba is a haven for threatened species, home to the DRC’s last herd of wild zebras. Some of the last remaining elephants in southern DRC also roam the 1.3m-hectare (3.2m-acre) park, which is larger than Lebanon.\", \"The park had become a rare conservation success story in DRC, which remains one of the world’s most dangerous countries for wildlife defenders. In recent years, it raised funding to recruit new rangers, and animal populations decimated by poaching began to recover.\", \"Upemba’s 256 rangers, many close to retirement age, are trained to tackle poachers, not militia groups. Although the park had received warnings, there was little preparation for the size of the assault on 3 March.\", \"According to accounts from attack survivors and those involved in the emergency response, the assailants were divided into two groups.\", \"Disparate fighters, probably drawn from a local pro-independence militia, Bakata Katanga, made up the larger group. They were unruly: drunk or high, with some wielding bows and arrows and machetes.\", \"But a smaller group of about 20 men appeared highly trained. Dressed in black fatigues, they were equipped with radios, machine guns and rocket-propelled grenades.\", \"“They had very precise instructions,” says Maxime Devolder, a Belgian working on park development programmes, who said the commandos told him they had orders not to harm foreigners.\"] },\n      { id: 'f2', outlet: 'The Guardian', title: 'Supermarket guards, truck drivers and \\u2018very big mistakes\\u2019: the failed role of western mercenaries in the fall of Goma', dek: 'The operation was sloppy, marred by pay disputes and equipment shortages. It deployed ex-members of the security forces but also untrained recruits, such as supermarket guards, according to a one-year joint investigation.', date: 'March 14, 2025', url: 'https://www.theguardian.com/global-development/2025/mar/14/failed-role-western-mercenaries-fall-of-goma-drc',\n        summary: [\"In January, after the two-year siege of the Congolese city of Goma ended with victory for the M23 rebels and Rwandan troops, an ill-assorted group of nearly 300 white mercenaries were lined up to have their humiliating defeat televised.\", \"“You must not joke with us,” barked Willy Ngoma, the M23’s military spokesperson, at one man he’d ordered to sit on the ground with his hands clasped behind his head.\", \"The day before, on 28 January, the M23 militia and Rwandan soldiers had together captured the largest city in the eastern DRC. It was a spectacular defeat, not just for Congolese forces, but also for the Europeans whom the government had hoped would protect Goma.\", \"Congolese leaders have a history of employing white mercenaries. They led infamous campaigns against rebels in the turbulent years after independence from Belgium in 1960. Former Congolese dictator Mobutu Sese Seko also hired ex-Yugoslav mercenaries as his regime collapsed in the 1990s.\", \"In late 2022, with the M23 surrounding Goma, the DRC government hired two private-military firms. One, named Agemira, was made up of about 40 former French security personnel who provided intelligence and logistical support to the Congolese army.\", \"The bulk of the mercenaries came from a second firm headed by Horațiu Potra, a Transylvanian and former French legionnaire, known for handling security for politicians and mining sites in Africa. At their height, Potra’s men in DRC, who were predominantly Romanian, numbered about 1,000. In security circles, they were known as “the Romeos”.\", \"The operation was sloppy, marred by pay disputes and equipment shortages. It deployed ex-members of the security forces but also untrained recruits, such as supermarket guards, according to a one-year joint investigation from the Guardian, Romania’s Public Record and Belgium’s Le Soir. The Romeos also worked closely with local militias and participated in combat.\", \"As Congolese and allied military forces around Goma crumbled between 27 and 28 January, the Romeos made a run for the main UN base in the city centre, abandoning equipment, rifles and jeeps. “They were imminently going to be killed,” says a senior UN official, who asked to remain anonymous. M23 fighters then arrived at the UN base and gave the Romeos two hours to surrender. Some scaled the walls of the adjacent Serena Hotel to look down into the compound, creating panic inside.\", \"“It was a real, real crisis,” says the senior UN official, who added that high-stakes negotiations involving world presidents led to an extraction deal, an account confirmed by two other UN sources.\"] },\n      { id: 'f3', outlet: 'The Economist', title: \"Congo's response to Ebola is late and chaotic\", dek: \"“It’s been an extremely slow start,” says a UN official. “Surveillance is very, very, very weak. Case management is catastrophic.”\", date: 'May 28, 2026', url: 'https://www.economist.com/middle-east-and-africa/2026/05/28/congos-response-to-ebola-is-late-and-chaotic',\n        summary: [\"To grasp how hard it is to tackle Ebola in Ituri, the province in eastern Congo that is at the centre of the worst outbreak of the virus since 2018, consider recent events in the town of Mongbwalu. On May 24th young men attacked the local hospital four times in an effort to retrieve the corpse of a preacher who probably died of Ebola. The night before, arsonists had burned an isolation tent. When soldiers arrived and fired warning shots, dozens of patients fled in the chaos.\", \"The lack of rapid tests and a licensed vaccine for the Bundibugyo strain mean that medics already faced an onerous task to curb an outbreak that went undetected for weeks. Realities on the ground in eastern Congo exacerbate the challenge. As of May 28th there were more than 1,000 suspected cases and around 250 suspected deaths in Congo; the true figures will be higher. There is rising concern of regional spread. Uganda, which shares a border with Ituri, has confirmed seven cases and one death. South Sudan, also on the province’s border, may follow soon. There is a widespread sense that the epidemic is moving faster than the response.\", \"“We’ve faced fierce resistance, which has caused enormous damage,” says Richard Lokudi, the director of Mongbwalu hospital. Around a third of people surveyed in Ituri by ActionAid, an NGO, do not believe that Ebola is real. There is a deep lack of trust in an area where the state is weak, militias prey on the population, and almost 1m live in refugee camps. Some locals believe doctors are killing patients. They bristle when doctors tell them they must not all gather round and wash the corpse at a funeral, as local custom demands. Others think that NGOs have invented the disease to line their pockets. His staff have not been trained in how to handle Ebola patients safely, says Mr Lokudi. Nor is there money for petrol to drive around to look for the sick. Mongbwalu’s only ambulance now doubles as a hearse to take corpses to their graves. “It’s a bit of a mess,” he says.\"] },\n    ].map((a, i) => {\n      const isSel = this.state.openFeaturedId === a.id;\n      return { ...a, expanded: isSel, toggle: () => this.toggleOpen('reporting', a.id),\n        chipStyle: `cursor:pointer; background:oklch(97.5% 0.008 76); border-radius:18px; box-shadow:0 8px 20px -16px oklch(20% 0.02 60 / 0.28); border-left:4px solid ${isSel ? 'oklch(33% 0.15 25)' : 'oklch(80% 0.02 60)'}; padding:14px 20px;` };\n    });\n    const featuredHasSel = !!this.state.openFeaturedId;\n    const selectedFeatured = featured.find(a => a.id === this.state.openFeaturedId) || null;\n    const featuredListStyle = `position:relative; padding-left:36px; flex-shrink:0; max-width:100%; width:${featuredHasSel ? '260px' : 'min(620px, 100%)'}; box-sizing:border-box; transition:width .2s;`;\n\n    const reportingGroups = [\n      { name: 'The Economist', items: [\n        { title: 'The Ebola epidemic is getting out of control', date: 'July 12, 2026', url: 'https://www.economist.com/middle title: \"DRC Ebola outbreak: what it's like to be a health worker fighting it\", date: 'June 30, 2026', url: 'https://www.npr.org/2026/06/30/nx-s1-5873364/drc-congo-ebola-health-workers-doctors', audio: 'audio/20260630_sotw_drc_congo_ebola_health_workers_doctors.mp3', startAt: 0,\n        transcript: \"Next, we learn what it’s like to be a health care worker battling Ebola. (0:04) The outbreak in the Democratic Republic of Congo has killed more than 300 people. (0:09) The living rely on health clinics that barely functioned even before this outbreak because of war (0:15) and poverty in the eastern province of Ituri. (0:18) Emmet Livingstone reports that for health care workers, (0:21) every patient they treat also poses a risk. (0:28) Community nurse Moise Boulabantu is on his cell phone. (0:32) He’s in his tiny clinic serving about 40,000 people in the suburbs of Bunia, the capital of Ituri. (0:39) An alert about a possible Ebola case has just come in. (0:50) There are a lot of cases, he says. (0:53) Of about 14 alerts we receive every day, about 10 meet the definition for Ebola. (1:04) It frightens us, the community nurse says, (1:07) because we don’t have protective equipment. We’re extremely afraid. (1:11) Boulabantu, who is 38, looks pale and overworked. (1:15) Not only does he lack protective equipment, but in his clinic, (1:18) a low wooden building of several rooms, he has no way of isolating suspected cases. (1:25) In Bunia, which has the biggest caseload, a large screen in the city’s central plaza (1:30) plays a health warning listing Ebola symptoms such as fever, headaches and vomiting. (1:35) This message urges anyone with symptoms to seek medical treatment. (1:42) Lots of people are sickening and dying at home, unnoticed. (1:47) The province is about the size of West Virginia and is very rural. (1:51) It has few good roads, several ongoing armed conflicts (1:54) and about 900,000 people living in displacement camps. (1:57) Anyone who shows the compassion and the care to take care of those who are sick (2:03) in an Ebola outbreak end up being the next victim. (2:06) That’s what makes this disease so terrible, right? (2:08) Family members who take care of their loved ones, healthcare workers, clinics and hospitals. (2:14) Shannon Hamilton is the team lead for evangelical aid organisation Samaritan’s Purse in Ituri. (2:19) Aid organisations are trying to train health staff across Ituri, (2:23) but the scale of what needs to be done is daunting. (2:26) Ebola has been reported in over half of the province’s health zones, (2:29) many of them difficult to access. (2:31) There’s about 22 or 23 health zones now that are affected by the outbreak. (2:34) A lot of those health zones aren’t receiving a lot of that training (2:38) and resources and support yet at this time. (2:42) This challenge is more acute outside of Bunia, the province’s only city. (2:47) Take Nyankunde Hospital, (2:49) where an American doctor contracted Ebola in the early days of the epidemic. (2:53) He was evacuated and later recovered. (2:55) Health workers here still say they aren’t receiving enough PPE. (3:01) Desiré Douabou is the head doctor of the Nyankunde health zone. (3:08) It’s not a rosy situation, says Douabou, it’s so difficult. (3:14) Eight hospital staff have been infected and one student doctor has died. (3:19) The first recorded Ebola case in Nyankunde, a pregnant woman, (3:23) also infected other patients because she wasn’t isolated. (3:26) She died soon after being admitted. (3:27) Conditions are better than they were several weeks ago (3:30) because a new Ebola treatment centre is opening next door. (3:34) But when we visited in mid-June, (3:36) people suspected of having Ebola were still mixing with others. (3:39) And one small restroom facility served all the patients, (3:43) regardless of their illness. (3:48) Douabou says that he and his colleagues (3:50) summon the courage to help the sick because they must. (3:54) But without enough PPE, the stress of getting infected is always there. (3:57) In Ituri, even the smallest gesture, opening a door, (4:01) touching a chair, have become a calculated risk. (4:04) As Ebola spreads through these under-resourced clinics, (4:07) the line between caregiver and patient grows ever thinner. (4:11) For NPR News, I’m Emmet Livingstone in Bunya.\" },\n      { id: 'r1', outlet: 'NPR', title: 'The town where the latest Ebola outbreak likely began', date: 'June 24, 2026', url: 'https://www.npr.org/2026/06/24/nx-s1-5869699/the-town-where-the-latest-ebola-outbreak-likely-began', audio: 'audio/20260624_sotw_the_town_where_the_latest_ebola_outbreak_likely_began.mp3', startAt: 42,\n        transcript: \"An Ebola outbreak is spreading across the Eastern Democratic Republic of Congo. (0:47) Health experts warn it could become one of the largest Ebola outbreaks in recent years. (0:52) In just over a month, Congo’s health ministry says more than 1,000 cases have been confirmed (0:57) and more than 250 people have died. (1:00) The outbreak was first detected in the gold mining town of Mangualu, where health workers (1:05) began noticing a cluster of mysterious illnesses and deaths earlier this year. (1:10) By the time authorities officially declared an outbreak in May, the virus had already (1:15) gained a foothold. (1:16) Since then, cases have been reported elsewhere in Eastern Congo and across the border in (1:21) Uganda. (1:22) But Mangualu remains one of the outbreak’s hotspots. (1:26) Health workers there are battling not only the virus itself, but also fear, misinformation (1:31) and deep mistrust of medical authorities. (1:34) Reporter Emmet Livingstone takes us to ground zero of this Ebola outbreak. (1:41) Mangualu has grown accustomed to the sound of loss. (1:45) On a green hilltop in the town’s only hospital, relatives of a patient who has died of Ebola (1:50) openly grieve. (1:53) In this impoverished town of about 130,000 people, there are Ebola deaths almost every (1:59) day. (2:01) No one is sure how long the disease has been circulating here, but it was spreading before (2:06) health workers raised the alarm. (2:09) Joseph Muté is a community leader in the Mangualu neighbourhood worst hit by the virus. (2:20) He says that from at least March, people started dying in their homes with blood in their mouths (2:26) and blood in their noses. (2:28) Bleeding is a hallmark of Ebola infection, but no one suspected the disease at first. (2:34) Tuberculosis, AIDS and mercury poisoning were all advanced as possible reasons. (2:40) Another popular theory was that the burning of a damaged coffin in February had placed (2:45) a curse on the area. (2:51) Burning the coffin violated a taboo. (2:54) As Joseph Muté put it, some believed that the flames of the coffin spread through the (2:58) neighbourhood bringing illness. (3:00) The community leader pointed out several empty houses where Ebola had decimated whole (3:05) families. (3:06) About 50 people have died in his neighbourhood alone, Joseph says. (3:14) Few residents agreed to talk to us. (3:17) This is a rough and remote mining town where people live close together in unsanitary conditions. (3:23) It’s been over a month since Congo officially declared an outbreak, and while the reality (3:27) of Ebola has set in, there are still parts of Mangualu that are hostile to health responders. (3:33) This resistance, coupled with poverty, partly explains how Ebola spread. (3:41) Another reason is gold, the bedrock of Mangualu’s economy. (3:46) I’m in a gold mine in Mangualu. (3:49) It’s in a valley surrounded by steep green hills with lush grass, palm trees, eucalyptus (3:57) trees. (3:58) You can hear the sound of a generator, and that’s pushing sand down a sluice. (4:03) Workers then look through that sluice to try and find bits of gold. (4:06) There are I’d say maybe 20, 30 pits here. (4:10) Dozens and dozens and dozens of people are working despite the Ebola outbreak. (4:15) The w eeling common to everyone here. (6:44) But at least for a fleeting moment, the hospital celebration offers a rare release from a nightmare (6:49) that shows no sign of disappearing soon. (6:51) For NPR News, I’m Emmet Livingstone in Mangualu. (7:04) That’s the State of the World from NPR. Thanks for listening.\" },\n      { id: 'r2', outlet: 'NPR', title: 'The war raging in the Democratic Republic of Congo', date: 'February 26, 2026', url: 'https://www.npr.org/2026/02/26/nx-s1-5727883/the-war-raging-in-the-democratic-republic-of-congo', audio: 'audio/20260226_sotw_the_war_raging_in_the_democratic_republic_of_congo.mp3', startAt: 42,\n        transcript: \"Every episode of It's Been a Minute, NPR's What's Happening in Culture podcast, starts (0:06) by asking three questions. Who? How? Why now? If the culture's asking it, we're talking (0:11) about it. At NPR, we stand for your right to be curious and indulge your cultural curiosity. Follow It's Been a Minute wherever you get your podcasts, and we'll break down the (0:20) zeitgeisty topics that are filling your feed. (0:24) Today on State of the World, the war raging in the Democratic Republic of Congo. You're (0:34) listening to State of the World from NPR. We bring you the day's most vital international (0:38) stories up close where they're happening. I'm Greg Dixon. (0:42) It is a war for control of some of the world's richest mineral reserves, and the violence (0:48) of the conflict is heightened by longstanding ethnic and political tensions. In the Eastern (0:54) Democratic Republic of Congo, government forces and local militia groups are fighting (0:58) M23 rebels backed by neighboring Rwanda. This is one of the wars President Trump repeatedly (1:05) claims to have ended. But though a peace deal was signed, the fighting hasn't stopped. (1:11) Reporter Emmet Livingstone gives us a glimpse of the conflict from behind the government (1:16) front lines in Eastern Congo. (1:20) Two wounded soldiers are rushed into a
